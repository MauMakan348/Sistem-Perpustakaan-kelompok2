<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Peminjaman Buku Perpustakaan (Microservice)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="loginScreen" class="screen">
    <div class="card">
      <h1>📚 Perpustakaan Kampus</h1>
      <p class="subtitle">Masuk atau buat akun untuk meminjam buku</p>

      <form id="loginForm">
        <h2>Login</h2>
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" autocomplete="username" minlength="3" maxlength="32" required placeholder="Username">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="Password">
        <button type="submit" id="btnLogin">Login</button>
      </form>

      <hr>

      <form id="registerForm">
        <h2>Registrasi</h2>
        <label for="registerUsername">Username</label>
        <input type="text" id="registerUsername" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" required placeholder="3-32 huruf, angka, atau underscore">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="Minimal 8 karakter">
        <button type="submit" id="btnRegister">Buat Akun</button>
      </form>
      <p class="hint">Password disimpan dalam bentuk hash di database server. Jangan gunakan password penting milik akun lain.</p>
      <p id="authMessage" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="appScreen" class="screen hidden">
    <header>
      <h1>📚 Perpustakaan Kampus</h1>
      <div class="user-info">
        <span id="namaMahasiswa"></span>
        <button id="btnLogout">Logout</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Daftar Buku</h2>
        <table id="tabelBuku">
          <thead>
            <tr><th>Judul</th><th>Penulis</th><th>Status</th><th>Aksi</th></tr>
          </thead>
          <tbody id="bodyBuku"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Buku Saya (<span id="jumlahPinjam">0</span>/3)</h2>
        <table id="tabelPinjaman">
          <thead>
            <tr><th>Judul</th><th>Tanggal Pinjam</th><th>Jatuh Tempo</th></tr>
          </thead>
          <tbody id="bodyPinjaman"></tbody>
        </table>
      </section>
    </main>
  </section>

  <script src="script.js"></script>
</body>
</html>
