<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Kampus</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Halaman Login -->
    <section id="loginPage" class="page">
        <div class="login-container">
            <h1>Perpustakaan Kampus</h1>
            <p>Silakan login untuk melanjutkan</p>

            <form id="loginForm">
                <label for="studentName">Nama Mahasiswa</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Masukkan nama mahasiswa"
                    required
                >

                <button type="submit">Login</button>
            </form>
        </div>
    </section>


    <!-- Halaman Utama -->
    <section id="appPage" class="page hidden">

        <header class="header">
            <div>
                <h1>Perpustakaan Kampus</h1>
                <p id="welcomeText"></p>
            </div>

            <button id="logoutButton" class="logout-button">
                Logout
            </button>
        </header>


        <main class="container">

            <!-- Informasi Peminjaman -->
            <section class="info-section">
                <h2>Informasi Peminjaman</h2>

                <div class="info-card">
                    <p>
                        Buku aktif:
                        <strong>
                            <span id="activeBorrowCount">0</span>/3
                        </strong>
                    </p>

                    <p>
                        Maksimal peminjaman aktif adalah 3 buku.
                    </p>
                </div>

                <div id="borrowInfo" class="borrow-info">
                    Belum ada buku yang dipinjam.
                </div>
            </section>


            <!-- Daftar Buku -->
            <section class="book-section">
                <h2>Daftar Buku</h2>

                <div id="bookList" class="book-list">
                    <!-- Buku akan ditampilkan oleh JavaScript -->
                </div>
            </section>

        </main>

    </section>


    <script src="script.js"></script>

</body>
</html>
